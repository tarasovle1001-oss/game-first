<!doctype html>
<meta charset="utf-8">
<title>Синтетика - кадры для концептных LoRA</title>
<style>
body{font:14px system-ui;margin:14px;background:#1b1b1d;color:#ddd}a{color:#9cf}
select,button,input{background:#2a2a2e;color:#ddd;border:1px solid #555;border-radius:4px;padding:4px 8px;font:inherit}button{cursor:pointer}button.go{background:#7a4a1a}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.dim{color:#999}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;margin-top:8px}
#grid div{position:relative;border:3px solid #333;border-radius:4px;cursor:pointer;min-height:60px}#grid img{width:100%;display:block}
#grid .keep{border-color:#3c3}#grid .drop{border-color:#c33;opacity:.45}#grid .pre{border-color:#777;opacity:.35}#grid small{position:absolute;left:2px;top:2px;background:#000a;padding:0 3px;font-size:11px}
#big{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9}#big img{max-height:86vh;max-width:96vw}#big p{margin:6px;max-width:90vw;text-align:center}
table{border-collapse:collapse;margin-top:6px}td,th{border:1px solid #444;padding:2px 6px;text-align:left;font-size:12px;vertical-align:top}
pre{white-space:pre-wrap;background:#242428;padding:8px;border-radius:4px;font-size:12px}
</style>
<h2>Синтетика <small class="dim">кадры для концептных LoRA · <a href="/">промпт-лаба</a></small></h2>
<div class="bar"><select id="concept"></select> <span id="ctitle" class="dim"></span></div>
<div class="bar">Круг: <select id="round"></select> <span id="rstat"></span>
  <button id="stop">стоп</button><button id="resume">продолжить</button></div>
<div class="bar">
  <button id="preview">Примеры промптов (без генерации)</button>
  <button id="wide" class="go">Новый круг: широкий</button>
  <button id="hits" class="go">Новый круг: по удачным</button>
  масштаб <input id="scale" value="1" size="3" title="1 = столько кадров, сколько записано у цели; 0.25 = четверть">
  <button id="export">Собрать датасет из оставленных</button> <span id="msg" class="dim"></span></div>
<div class="bar">Цель: <select id="target"></select>
  Показать: <select id="show"><option value="new">непросмотренные</option><option value="keep">оставленные</option><option value="drop">выкинутые</option><option value="all">все</option></select>
  <label><input type="checkbox" id="pre"> показывать то, что отсеял Claude</label>
  <span class="dim">Клик - крупно. K / → оставить, D / ← выкинуть, Backspace назад, Esc закрыть.</span></div>
<div id="out"></div>
<div id="grid"></div>
<details><summary>Что попадает: доля оставленных по вариантам</summary><div id="stats"></div></details>
<div id="big"><img><p></p></div>
<script>
const $ = (id) => document.getElementById(id);
const J = async (u, b) => { const r = await fetch(u, b ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(b) } : undefined); const j = await r.json(); if (!r.ok) throw Error(j.error || r.status); return j; };
let book = null, R = null, view = [], cur = -1;
const C = () => book.concepts.find((c) => c.id === $("concept").value);
const say = (t) => ($("msg").textContent = t);

async function loadBook(keep) {
  book = await J("/api/synth/concepts");
  const was = $("concept").value;
  $("concept").replaceChildren(...book.concepts.map((c) => new Option(`${c.title}`, c.id)));
  if (was) $("concept").value = was;
  const c = C();
  $("ctitle").textContent = `триггер ${c.trigger} · ${c.targets.reduce((a, t) => a + t.count, 0)} кадров на широкий круг`;
  const wasR = $("round").value;
  $("round").replaceChildren(...c.rounds.map((r) => new Option(`К${r.round} · ${r.mode === "hits" ? "по удачным" : "широкий"} · ${r.drawn}/${r.total}`, r.round)));
  if (keep && wasR) $("round").value = wasR; else if (c.rounds.length) $("round").value = c.rounds.at(-1).round;
  const wasT = $("target").value;
  $("target").replaceChildren(new Option("все цели", ""), ...c.targets.map((t) => new Option(`${t.title} (${t.id})`, t.id)));
  if (keep) $("target").value = wasT;
  drawStats();
}
function drawStats() {
  const c = C();
  const rows = c.targets.map((t) => {
    const s = c.stats[t.id];
    if (!s) return `<tr><td>${t.title}</td><td colspan=2 class=dim>ещё не смотрели</td></tr>`;
    const ax = Object.entries(t.axes).map(([a, vals]) => `<b>${a}</b>: ` + vals.map((v, i) => { const [seen, keep] = s.axes[a]?.[i] ?? [0, 0]; return `${keep}/${seen} <span class=dim>${v.slice(0, 60)}</span>`; }).join("<br>")).join("<br>");
    const looks = Object.entries(s.looks).map(([l, [seen, keep]]) => `${l} ${keep}/${seen}`).join(", ");
    return `<tr><td>${t.title}<br><span class=dim>${looks}</span></td><td>${s.keep}/${s.seen}</td><td>${ax}</td></tr>`;
  });
  $("stats").innerHTML = `<table><tr><th>цель</th><th>оставлено</th><th>по вариантам (оставлено / просмотрено)</th></tr>${rows.join("")}</table>`;
}
async function loadRound() {
  $("grid").replaceChildren(); R = null;
  if (!$("round").value) { $("rstat").textContent = "кругов ещё нет"; return; }
  R = await J(`/api/synth/round?c=${$("concept").value}&k=${$("round").value}`);
  draw();
}
const titleOf = (id) => C().targets.find((t) => t.id === id)?.title ?? id;
function draw() {
  if (!R) return;
  const t = $("target").value, show = $("show").value, pre = $("pre").checked;
  const drawn = R.frames.filter((f) => f.file);
  $("rstat").textContent = `${R.status === "running" ? "идёт" : R.status === "done" ? "готов" : "остановлен"}: ${drawn.length}/${R.frames.length} кадров · оставлено ${R.frames.filter((f) => f.mark === "keep").length} · выкинуто ${R.frames.filter((f) => f.mark === "drop").length} · отсеял Claude ${R.frames.filter((f) => f.pre && !f.mark).length} · осталось смотреть ${drawn.filter((f) => !f.mark && !f.pre).length}`;
  view = drawn.filter((f) => (!t || f.target === t) && (pre || !f.pre || f.mark) && (show === "all" || (show === "new" ? !f.mark : f.mark === show)));
  $("grid").replaceChildren(...view.slice(0, 600).map((f, n) => {
    const d = document.createElement("div");
    d.className = f.mark ?? (f.pre ? "pre" : "");
    d.innerHTML = `<img loading="lazy" src="/synth/img?c=${R.concept}&k=${R.round}&i=${f.i}"><small>${f.target}</small>`;
    d.onclick = () => open(n);
    return d;
  }));
  if (view.length > 600) say(`показаны первые 600 из ${view.length}`);
}
function open(n) {
  if (n < 0 || n >= view.length) { $("big").style.display = "none"; cur = -1; draw(); return; }
  cur = n;
  const f = view[n];
  $("big").style.display = "flex";
  $("big").querySelector("img").src = `/synth/img?c=${R.concept}&k=${R.round}&i=${f.i}`;
  const t = C().targets.find((x) => x.id === f.target);
  const ax = Object.entries(f.picks).map(([a, v]) => t?.axes[a]?.[v]).filter(Boolean).join(" · ");
  $("big").querySelector("p").innerHTML = `<b>${titleOf(f.target)}</b> · ${f.look} · ${n + 1}/${view.length} ${f.mark === "keep" ? "· ОСТАВЛЕН" : f.mark === "drop" ? "· выкинут" : ""}<br><span class=dim>${ax}</span>`;
}
async function mark(m) {
  const f = view[cur];
  f.mark = m;
  void J("/api/synth/mark", { concept: R.concept, round: R.round, i: f.i, mark: m }).catch((e) => say(e.message));
  open(cur + 1);
}
document.addEventListener("keydown", (e) => {
  if (cur < 0) return;
  if (["k", "K", "л", "Л", "ArrowRight"].includes(e.key)) { e.preventDefault(); void mark("keep"); }
  else if (["d", "D", "в", "В", "ArrowLeft"].includes(e.key)) { e.preventDefault(); void mark("drop"); }
  else if (e.key === "Backspace") { e.preventDefault(); if (cur > 0) open(cur - 1); }
  else if (e.key === "Escape") open(-1);
});
$("big").onclick = (e) => { if (e.target === $("big")) open(-1); };
$("concept").onchange = async () => { await loadBook(false); await loadRound(); };
$("round").onchange = loadRound;
for (const id of ["target", "show", "pre"]) $(id).onchange = draw;
$("preview").onclick = async () => {
  const p = await J(`/api/synth/preview?c=${$("concept").value}&scale=${$("scale").value}&per=2`);
  $("out").innerHTML = `<pre>Всего ${p.total} кадров.\n\n` + p.byTarget.map((t) => `## ${t.title} - ${t.count} кадров\n` + t.samples.map((s) => `[${s.look}, ${s.size}]\n+ ${s.positive}\n- ${s.negative}`).join("\n\n")).join("\n\n").replace(/</g, "&lt;") + `</pre>`;
};
const newRound = async (mode) => {
  const p = await J(`/api/synth/preview?c=${$("concept").value}&scale=${$("scale").value}&per=0`);
  if (!confirm(`Запустить генерацию: ${p.total} кадров на том ComfyUI, к которому подключена эта лаба?\n(на ноутбуке это около ${Math.round(p.total * 10 / 60)} мин, на арендной 5090 около ${Math.ceil(p.total / 60)} мин)`)) return;
  const r = await J("/api/synth/round", { concept: $("concept").value, mode, scale: Number($("scale").value) || 1, targets: $("target").value ? [$("target").value] : undefined });
  say(`Круг К${r.round}: ${r.frames} кадров в очереди`);
  await loadBook(false); await loadRound();
};
$("wide").onclick = () => newRound("wide").catch((e) => say(e.message));
$("hits").onclick = () => newRound("hits").catch((e) => say(e.message));
$("stop").onclick = async () => { if (R) { await J("/api/synth/stop", { concept: R.concept, round: R.round }); await loadRound(); } };
$("resume").onclick = async () => { if (R) { await J("/api/synth/resume", { concept: R.concept, round: R.round }); await loadRound(); } };
$("export").onclick = async () => { const r = await J("/api/synth/export", { concept: $("concept").value }); say(`Датасет: ${r.pictures} кадров в ${r.folder}`); };
setInterval(async () => { if (R?.status === "running" && cur < 0) { await loadBook(true); await loadRound(); } }, 8000);
loadBook(false).then(loadRound).catch((e) => say(e.message));
</script>
