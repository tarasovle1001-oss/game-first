log.her.browse.plain.1: "In town she simply walks round the shops: looks, touches the fabrics, buys nothing."
log.her.browse.plain.2: "She does the shops, has a coffee by the window and walks back."
log.her.browse.plain.3: "She stands at a window full of shoes for a long time, does the sums and moves on."
log.her.browse.outfit.1: "In a shop she holds something bolder than her own against herself in the mirror ({outfit}), glances round and hangs it back."
log.her.browse.outfit.2: "She tries on what she would not have worn before ({outfit}). Looks at herself in the cubicle longer than needed. Does not take it yet."
log.her.browse.outfit.3: "The shop girl suggests something bolder ({outfit}). She laughs: \"Not for me.\" But she remembers the price."
log.her.browse.toys.1: "She walks past the shop with the dark window twice; the third time she goes in."
log.her.browse.toys.2: "In the adult shop she pretends she came in by chance, and stands at one shelf for a long time."
log.her.browse.toys.3: "She goes into the adult shop as into a chemist's: quickly, looking at nobody. At the shelf with the toys she slows down."
log.her.browse.toys.bigger.1: "\"And these - who are they even for? Can anybody really...\""
log.her.browse.toys.bigger.2: "\"I am a long way from those. But nobody forbids looking.\""
log.her.browse.toys.notyet.1: "\"Just looking. I don't need this. Probably.\""
