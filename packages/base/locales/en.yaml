log.approach.retro: "She sits on the edge of the bed, taking her earrings off. \"With {name} tonight there was... {act}. Did I do right?\""
action.answer.retro.right: "\"You did. That is how it should be\""
action.answer.retro.further: "\"You could have gone further\""
action.answer.retro.dont: "\"No. Not like that again\""
action.answer.retro.yours: "\"That is for you to decide, not me\""
log.answer.retro.right: "\"You did right.\" She breathes out and nods. Next time she will not hesitate ({act})."
log.answer.retro.further: "\"You could have gone further.\" She looks up at you and says nothing for a long time. \"All right. I will remember.\""
log.answer.retro.dont: "\"Not like that again.\" She lowers her head. \"Understood.\" With {name} she will keep her distance now."
log.answer.retro.yours: "\"For you to decide.\" One corner of her mouth goes up: \"Convenient.\" But she does not argue."
