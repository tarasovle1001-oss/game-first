# her head
thought.anger.1: "\"Does he hear me at all?\""
thought.anger.2: "\"Once more and I will not keep quiet.\""
thought.anger.3: "\"I am angry. And he has not even noticed.\""
thought.contempt.1: "\"And this is my husband.\""
thought.contempt.2: "\"I never used to see it. Now I cannot unsee it.\""
thought.contempt.3: "\"He could at least try.\""
thought.guilt.1: "\"He knows nothing. That only makes it worse.\""
thought.guilt.2: "\"Why did I do that.\""
thought.guilt.3: "\"I should have stopped sooner.\""
thought.shame.1: "\"Everyone saw.\""
thought.shame.2: "\"My face is burning. Please, nobody look.\""
thought.shame.3: "\"How do I walk back out there.\""
thought.longing.1: "\"This is not enough for me.\""
thought.longing.2: "\"When was I last simply wanted?\""
thought.longing.3: "\"I lie here thinking of the wrong things.\""
thought.disgust.1: "\"I want to wash my hands after him.\""
thought.disgust.2: "\"He makes my skin crawl.\""
thought.disgust.3: "\"Not that. Not him.\""
thought.fear.1: "\"He is not going to let it go.\""
thought.fear.2: "\"My heart is pounding. Where is my husband?\""
thought.fear.3: "\"I should have walked away at once.\""
thought.pride.1: "\"I can say no. And I did.\""
thought.pride.2: "\"It is still me who decides.\""
thought.pride.3: "\"They look. Let them look.\""
thought.tenderness.1: "\"He is a good one, after all.\""
thought.tenderness.2: "\"It is warm with him. That has not gone anywhere.\""
thought.tenderness.3: "\"I should hold him later.\""
thought.delight.1: "\"God, that is good.\""
thought.delight.2: "\"More. I want more.\""
thought.delight.3: "\"This is what being alive is for.\""
thought.morning.quiet.1: "\"An ordinary day. I suppose that is good.\""
thought.morning.quiet.2: "\"Nothing happened yesterday. I do not know if I am glad.\""
thought.morning.quiet.3: "\"One more day like the rest.\""
thought.morning.guest.1: "\"I went further yesterday than I meant to. And I am not ashamed.\""
thought.morning.guest.2: "\"The way he looked at me. I still feel it.\""
thought.morning.guest.3: "\"I wonder if he comes in tonight.\""
thought.morning.guest_guilty.1: "\"What did I do yesterday.\""
thought.morning.guest_guilty.2: "\"I cannot look my husband in the eye.\""
thought.morning.guest_guilty.3: "\"This must not happen again. Probably.\""
thought.morning.husband_good.1: "\"It was good with him last night. It has been a while.\""
thought.morning.husband_good.2: "\"I woke up smiling. Silly, but nice.\""
thought.morning.husband_good.3: "\"Maybe we are not so badly off.\""
thought.morning.husband_bad.1: "\"He fell asleep content. And me?\""
thought.morning.husband_bad.2: "\"Left with nothing again.\""
thought.morning.husband_bad.3: "\"He tried. I suppose. It does not help.\""
thought.morning.both.1: "\"Two of them yesterday. Comparing is wrong. I compare anyway.\""
thought.morning.both.2: "\"After him my husband felt different.\""
thought.morning.both.3: "\"I lay down with my husband and thought of someone else.\""
