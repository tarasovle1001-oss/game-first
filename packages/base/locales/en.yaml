log.talk.chatter.3: "\"We really have to fix that step. I trip on it every time.\" You promise. She pretends to believe you."
log.talk.chatter.4: "She remembers how you mixed up the orders in the first year. She laughs until she has to stop walking."
log.talk.chatter.5: "You talk about getting a cat. She is for it. You ask who will comb the fur out of the coffee machine."
log.talk.chatter.6: "\"Guess what I heard about the baker.\" Ten minutes of other people's news follow, none of it important."
log.talk.chatter.7: "She counts on her fingers how many years since you were last at the sea. There are enough fingers, and she does not like the answer."
log.talk.chatter.8: "You make up names for dishes that are not on the menu. \"Soup of yesterday\" wins."
log.talk.chatter.9: "She asks whether you remember what she wore on your first date. You remember almost everything. The \"almost\" keeps her going for a whole minute."
log.talk.chatter.10: "You talk about the weather. Seriously, at length and with pleasure, like old people."
log.talk.chatter.11: "She hums something from the radio and loses it at the chorus. You come in on the wrong note."
log.talk.chatter.12: "\"If we had a day off, a real one, what would you do?\" You make a list and by the third item it is work again."
log.talk.chatter.13: "She points at a sign across the street and explains what is wrong with it. You cannot see the difference, and nod."
log.talk.chatter.14: "You remember the guest who ordered tea and sat with it for four hours. Each of you has a theory."
log.talk.chatter.15: "She says her mother called again and asked about \"a proper job\". You are both quiet, then she snorts."
