log.react.cheer: "\"You are doing fine,\" you say aloud. {name} grins. She goes red to the neck and does not stop ({act})."
log.react.limit: "You lean in to her: \"This is fine. And a little more. No further.\" She nods without looking at {name}."
log.react.lead_away: "\"I need you for a minute.\" You take her off by the elbow. {name} is left with empty hands."
log.react.leave: "You look at them a second longer and walk off. Her eyes follow you. {name}'s do not."
log.react.send_staff: "\"Not here. Go to the staff room.\" She takes {name} by the hand and leads him without looking back."
log.react.send_room: "\"Go up to his.\" She looks at you to see if you mean it, and goes to the stairs. {name} follows."
log.react.send_bed: "\"Go upstairs. To ours.\" She stands still. Then she takes {name} by the hand."
log.react.join.no: "You step in close. She puts a palm on your chest: \"Not both at once. I cannot.\""
log.react.join.yes: "You step in close. She turns her face to you without letting go of {name}, and finds you with her hand. ({act})"
