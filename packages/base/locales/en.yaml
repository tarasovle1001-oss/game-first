action.talk.how_are_you: "\"How are you?\""
log.talk.how.fine: "You ask how she is. \"Fine.\" A shrug, and a smile."
log.talk.how.glad: "You ask how she is. \"Good. Really good.\" She leans on you for a second."
log.talk.how.drunk: "You ask how she is. She hangs on your arm and laughs. \"I am drunk. Very. And you are handsome\"."
log.talk.how.fedup: "You ask how she is. \"How am I? I have been pawed all night, that is how\". She does not look at you."
log.talk.how.tired: "You ask how she is. She sags, forehead on your shoulder. \"Barely standing. Hold me for a minute\"."
log.talk.how.resent: "You ask how she is. \"Do you really want to know?\" She waits for the answer longer than she has to."
log.talk.how.annoyed: "You ask how she is. She lets out a breath. \"Fed up. Not with you. With everyone\"."
log.talk.how.sore: "You ask how she is. \"Fine\". She shifts her weight and winces."
log.talk.how.low: "You ask how she is. \"Nothing much\". She turns the rag over in her hands and says no more."
log.talk.how.wanting: "You ask how she is. She looks at you a little longer than usual. \"Ask me that upstairs\"."
log.talk.how.when.prep: "\"We have not even opened yet\"."
log.talk.how.when.shift: "\"Ask me when we close\"."
log.talk.how.when.night: "\"The day is over. That is something\"."
log.talk.ask_day.drunk: "You ask about her day. She starts three stories at once, loses the thread and laughs at her own."
log.talk.ask_day.tired: "You ask about her day. \"Long\". She has no more words, but she nods, grateful."
log.talk.ask_day.cold: "You ask about her day. \"The usual\". She answers without turning round."
log.talk.ask_day.warm: "You ask about her day. She tells it in full and touches your sleeve at the funny parts."
log.talk.compliment.drunk: "You tell her she is beautiful. \"Say it again\". She offers her ear and nearly falls over."
log.talk.compliment.tired: "You tell her she is beautiful. \"Now? With this face?\" The smile comes anyway."
log.talk.compliment.cold: "You tell her she is beautiful. \"Mhm\". She fixes her hair, but not for you."
log.talk.compliment.warm: "You tell her she is beautiful. She blushes like in the first year and kisses your cheek, quickly."
log.talk.thank.drunk: "You thank her for the floor. \"To the floor! - She raises a glass that is not there. - And to me\"."
log.talk.thank.tired: "You thank her for the floor. She closes her eyes. \"Say it again tomorrow, when I can hear it\"."
log.talk.thank.cold: "You thank her for the floor. \"So you noticed\". Flat, no smile."
log.talk.joke.drunk: "You make her laugh. She laughs so that people look round, and grabs your elbow."
log.talk.joke.tired: "You make her laugh. A snort, with effort. \"Don't, I have no strength for it\"."
log.talk.joke.cold: "You joke. The corner of her mouth twitches and goes back."
log.talk.flirt_her.drunk: "You flirt with her. She plays along louder than she should and puts a palm on your chest."
log.talk.flirt_her.tired: "You flirt with her. \"Remember where you stopped. Finish it when I have slept\"."
log.talk.flirt_her.cold: "You flirt with her the way you used to. She looks at you as if you had the wrong evening."
log.talk.flirt_her.warm: "You flirt with her the way you used to. She gives it back, and for a minute you are those two again."
log.talk.hug.drunk: "You put your arms round her. She hangs on you with all her weight and mumbles something pleased into your neck."
log.talk.hug.tired: "You put your arms round her. She just stands in them with her eyes shut until she has to go."
log.talk.hug.cold: "You put your arms round her. She lets herself be held and waits for you to let go."
log.talk.hug.warm: "You put your arms round her. She holds you back hard, with both arms."
log.talk.hold_hand.drunk: "You take her hand. She swings your arms like a child and laughs."
log.talk.hold_hand.tired: "You take her hand. Her fingers are heavy and warm, and she leaves them there."
log.talk.hold_hand.cold: "You take her hand. In a couple of seconds there is something she has to straighten, and the hand is gone."
log.talk.kiss_her.drunk: "You pull her in and kiss her. She kisses back greedily, tasting of wine, and forgets you are not alone."
log.talk.kiss_her.tired: "You pull her in and kiss her. She answers softly and briefly. \"That is all there is of me tonight\"."
log.talk.kiss_her.cold: "You pull her in and kiss her. She does not take her lips away, and that is all."
log.talk.kiss_her.warm: "You pull her in and kiss her. She answers at once and pulls you closer by the collar."
log.talk.shoulders.drunk: "You work on her shoulders. She hums something happy and leans back against you."
log.talk.shoulders.tired: "You work on her shoulders. She groans out loud. \"Don't stop. Ever\"."
log.talk.shoulders.cold: "You work on her shoulders. They stay like stone. \"Thanks, that will do\"."
log.talk.stroke_hair.drunk: "You run a hand through her hair. She rubs against your palm like a cat, smiling with her eyes shut."
log.talk.stroke_hair.tired: "You run a hand through her hair. She nods off right under your hand."
log.talk.stroke_hair.cold: "You run a hand through her hair. She moves her head away a little."
log.talk.cuddle.drunk: "You lie in each other's arms. She tells the ceiling something long and falls asleep mid-word."
log.talk.cuddle.tired: "You lie in each other's arms. She is asleep before you have settled."
log.talk.cuddle.cold: "You lie side by side. You do the holding; she lies straight and looks into the dark."
log.husband.refuse.tired: "You reach for her ({act}). \"I am wrung out. There is nothing left tonight\". She does not apologise."
log.husband.refuse.sore: "You reach for her ({act}). She catches your hand. \"Not tonight. It hurts there\"."
log.husband.refuse.resent: "You reach for her ({act}). \"After today? No\". She lies down with her back to you."
log.husband.refuse.annoyed: "You reach for her ({act}). \"Everybody touched me today. Let me be nobody's for a while\"."
log.husband.refuse.mood: "You reach for her ({act}). \"Wrong mood. Just lie next to me\"."
log.husband.refuse.not_her: "You reach for her ({act}). She looks surprised. \"That? No. That is not me\"."
log.husband.refuse.sated: "You reach for her ({act}). A sleepy smile. \"I have had my fill today. Sleep\"."
log.husband.refuse.asleep: "You reach for her ({act}). She mutters something and pulls the blanket over her head."
log.husband.refuse.feelings: "You reach for her ({act}). \"I can't. My head is somewhere else\". She is not glad of it herself."
log.husband.refuse.trust: "You reach for her ({act}). She moves away. \"I do not trust you right now. So how could I\"."
log.husband.refuse.cold: "You reach for her ({act}). \"I don't feel like it\". No anger in it, which is worse."
log.husband.refuse.power: "You reach for her ({act}). She lifts your hand off with two fingers. \"Not tonight. I will say when\"."
log.refuse.why.tired: "She can barely stand; he is the last thing on her mind."
log.refuse.why.sore: "Even standing hurts right now."
log.refuse.why.annoyed: "She has had enough hands for one day."
log.refuse.why.mood: "Wrong evening, wrong mood."
log.refuse.why.not_her: "It is not her, and it shows on her face."
log.refuse.why.too_fast: "{name} is going too fast: yesterday there was nothing like it."
log.refuse.why.faithful: "She touches her ring with her thumb and steps away."
log.refuse.why.public: "Not in front of everyone: she glances round the room."
log.refuse.why.husband: "She looks your way before she answers him."
log.refuse.why.forbidden: "She remembers what you said about this."
log.refuse.why.him: "It is not the asking, it is him."
log.refuse.why.pushed: "The harder he pushes, the firmer her no."
log.refuse.why.sated: "She has had her fill today."
log.refuse.why.feelings: "She has no room for it: her head is elsewhere."
