log.take.took.1: "{name} goes in slowly. She holds her breath, grips his shoulder until her fingers go white, and takes him to the end. More than ever before. It is hot and tight inside."
log.take.took.2: "At first the head only presses against her. She shifts the angle a little herself, breathes out through her teeth - and he slips deeper. She holds still, getting used to how he stretches her."
log.take.took.3: "{name} asks if it hurts. She shakes her head, bites her lip and slowly sinks down until she feels his balls between her legs."
log.take.partial.1: "{name} gets only halfway in - further her walls won't let him. She winces, braces a palm against his belly and breathes hard."
log.take.partial.2: "Only the start works. She tries again, hisses through her teeth when the head meets a place that is too narrow, and stops."
log.take.partial.3: "He is barely inside her, and it is already too much. \"Stop. Wait. No, it won't work.\" She trembles and doesn't let him deeper."
log.take.failed.1: "They try, but he is too big for her: the head doesn't even get in. She looks down at his cock and laughs nervously."
log.take.failed.2: "{name} tries once, then again. She flinches at the pressure and moves away: \"It's not working. It really isn't.\""
log.take.failed.3: "She tries to sit on him herself - and can't. The difference is too big. She measures it with her palm and shakes her head."
log.take.never.1: "She looks at his cock and knows at once: it physically won't fit in her. Not even worth trying."
log.take.never.2: "\"No. Have you seen yourself? I can't do that.\" She says it without offence, almost with respect, looking at the size."
log.take.never.3: "{name} can see for himself that it won't work. She measures the thickness with her palm next to her opening and shakes her head."
log.take.instead.her: "\"Let's do it another way,\" she says herself. ({other})"
log.take.instead.him: "{name} does not insist and suggests something else. ({other})"
thought.take.took.1: "\"It worked. I never thought I could take one like that.\""
thought.take.took.2: "\"So that's what it's like when there is really a lot of him. I can still feel how it stretched me.\""
thought.take.took.3: "\"Tight. It burns. And somehow it's very good. I want more.\""
thought.take.took.far.1: "\"I did it. Tomorrow I'll walk around remembering how he fitted inside me.\""
thought.take.took.far.2: "\"After that, my husband... no, don't think about it now. But the body remembers.\""
thought.take.took.far.3: "\"A week ago I'd have said it was impossible. And now I can still feel him inside.\""
thought.take.partial.1: "\"Almost. Next time, maybe.\""
thought.take.partial.2: "\"A pity. I wanted all of it.\""
thought.take.partial.3: "\"I need to get used to it bit by bit. There are ways.\""
thought.take.failed.1: "\"It didn't work. I'm just not ready for that.\""
thought.take.failed.2: "\"Never a problem with my husband, that's for sure...\""
thought.take.failed.3: "\"Can you even get used to that, I wonder?\""
thought.take.never.1: "\"Does that even exist? I thought only in books.\""
thought.take.never.2: "\"Almost scary. And I keep looking.\""
thought.take.never.3: "\"Not today. But I'll remember it.\""
thought.size.small.1: "\"Well, nothing new here.\""
thought.size.small.2: "\"Like at home.\""
thought.size.small.3: "\"Ordinary. Almost reassuring.\""
thought.size.first.1: "\"Wait. They come like that? Then what does my husband have...\""
thought.size.first.2: "\"I thought everyone was about like my husband. Turns out they aren't. Not at all.\""
thought.size.first.3: "\"Well now. So it's mine who is that small. The others are normal.\""
thought.size.record.1: "\"I haven't seen a bigger one yet. And I'm not sure I can forget it.\""
thought.size.record.2: "\"Every time I think they don't come any bigger. And every time I'm wrong.\""
thought.size.record.3: "\"I'll remember him. You don't forget that. Not the size, not how he fitted inside me.\""
thought.size.toobig.1: "\"Beautiful, but not for me. Yet.\""
thought.size.toobig.2: "\"Where would that even go? Though I wonder...\""
thought.size.toobig.3: "\"I couldn't. Probably.\""
thought.size.seen.1: "\"Not bad. Not bad at all.\""
thought.size.seen.2: "\"Bigger than at home. Much.\""
thought.size.seen.3: "\"Now I know what he has. Probably a mistake.\""
