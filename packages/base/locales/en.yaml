log.send_up.go.limit: "\"Go. But you know where the line is.\" She nods and goes to {name}."
log.send_up.go.company: "\"Sit with him. Nothing more.\" She pulls a cardigan on and goes to {name}."
log.send_up.go.her_call: "\"Go and see him. What happens there is up to you.\" She looks at you for a long time and goes to {name}, never learning what you want."
log.send_up.back.full: "She comes back and sits by you. She tells it herself, without being asked: {act}. She watches how you take it."
log.send_up.back.less: "She comes back and lies down with her back to you. \"Nothing much. {act}, that is all.\""
log.send_up.back.nothing: "She comes back and goes straight to the bathroom. \"We sat, we talked.\" Not a word more."
log.send_up.truth: "In truth there was more with {name}: {act}."
log.send_up.stays: "She stays with {name} till morning."
log.send_up.alone: "You wait. She does not come back. Towards morning you fall asleep alone."
log.send_up.morning.full: "In the morning she comes from {name} and sits on the edge of the bed. \"I stayed. All of it: {act}. You sent me yourself.\""
log.send_up.morning.excuse: "In the morning she is not in the bed. She turns up half an hour later with a bag: \"I ran to the pharmacy, my stomach was bad.\""
