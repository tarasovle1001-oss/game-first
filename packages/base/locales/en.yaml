log.talk.ask_day: "You ask about her day. She talks, glad to be asked."
log.talk.compliment: "You tell her she looks beautiful. She smiles and fixes her hair."
log.talk.thank: "You thank her for carrying the floor. \"Somebody noticed,\" she says, softer than usual."
log.talk.joke: "You make her laugh."
log.talk.joke.no: "The joke falls flat. She is not in the mood."
log.talk.flirt_her: "You flirt with her like you used to. She plays along."
log.talk.flirt_her.no: "You flirt with her. She answers politely, like a stranger."
log.talk.dirty: "You whisper it in her ear. She bites her lip."
log.talk.dirty.no: "You whisper it in her ear. \"Not here,\" she hisses, red to the ears."
log.talk.hug: "You hold her for a moment. She leans into you."
log.talk.hold_hand: "You take her hand. She squeezes back."
log.talk.shoulders: "You work the ache out of her shoulders. She groans with relief."
log.talk.kiss_her: "You pull her close and kiss her. She kisses back."
log.talk.kiss_her.no: "You go to kiss her. She gives you her cheek."
log.talk.grab_ass: "You squeeze her ass as she passes. She swats your hand, grinning."
log.talk.grab_ass.no: "You squeeze her ass as she passes. She jerks away: \"What is wrong with you?\""
log.talk.pour_drink: "You pour her one. She drinks it with you."
log.talk.stand.warm: "\"We are good. I mean it,\" she says, and looks like she means it."
log.talk.stand.fine: "\"We are fine. Tired, but fine.\""
log.talk.stand.strained: "\"Honestly? Something is off lately. I do not know what you want from me.\""
log.talk.stand.cold: "She thinks for a long time. \"I do not feel much lately. With you, I mean.\""
log.talk.stand.bitter: "\"Do you really want to hear it?\" She does not wait for the answer."
log.talk.stand.open.shared: "\"And the other thing... it is ours. As long as it stays ours.\""
log.talk.stand.open.hers: "\"And the other thing is mine now. You know that.\""
log.talk.tonight.quiet: "\"An ordinary evening. Feet hurt.\""
log.talk.tonight.told: "She tells you about {name} ({act}), watching your face while she does."
log.talk.tonight.confess: "She hesitates. \"{name} went a bit far tonight. And I let him.\" ({act})"
log.talk.tonight.lie: "She leaves out what happened tonight ({act})."
