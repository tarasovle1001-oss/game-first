log.approach.harassed: "Она подходит к тебе. \"{name} сегодня совсем обнаглел. Руки распускает, слов не понимает. Сделай что-нибудь\"."
log.approach.affection: "Она подходит сзади и обнимает тебя, прижавшись щекой к спине. Просто так."
log.approach.affection.public: "Она подходит к тебе посреди зала и целует в губы, при всех. Просто так."
log.approach.tease: "Она прижимается к тебе, и её рука ложится тебе на ширинку. \"Скучал?\""
log.approach.tease.public: "Проходя мимо с подносом, она на ходу сжимает тебя через брюки. Никто вроде не видел. Вроде."
log.approach.comfort: "Она садится рядом и кладёт голову тебе на плечо. \"Тяжёлый день. Побудь со мной минуту\"."
log.approach.comfort.public: "Она останавливается возле тебя с пустым подносом. \"Я сейчас упаду. Скажи мне что-нибудь хорошее\"."
log.approach.ignored.harassed: "Ты так ничего и не ответил. Она возвращается в зал одна."
log.approach.ignored.affection: "Ты не отозвался. Она постояла и ушла."
log.approach.ignored.tease: "Ты не отозвался. Она убрала руку."
log.approach.ignored.comfort: "Ты промолчал. Она встала и ушла."
log.answer.harassed.protect: "Ты подходишь к его столику. {name} поднимает руки: \"Понял, понял\". Она смотрит на тебя из-за стойки, и в этом взгляде то, чего давно не было."
log.answer.harassed.endure: "\"Потерпеть\". Она повторяет это слово, как будто пробует на вкус. \"Ясно\". И уходит к {name}."
log.answer.harassed.endure.takes: "Она кивает. \"Ладно. Раз ты так говоришь\". И возвращается к столику {name}."
log.answer.harassed.ask: "\"Мне?\" Она смотрит на тебя с удивлением, потом со злостью. \"Я к тебе за помощью пришла\"."
log.answer.harassed.ask.admits: "Она молчит, потом отводит глаза. \"Не знаю. Противно. И... не только противно\". Щёки у неё красные."
log.answer.affection.return: "Ты разворачиваешься и обнимаешь её. Она стоит так дольше, чем нужно."
log.answer.affection.return.public: "Ты целуешь её в ответ. За столиками кто-то отворачивается к своей кружке."
log.answer.affection.busy: "\"Ладно\". Она убирает руки и уходит."
log.answer.tease.let: "Ты не мешаешь. Она гладит тебя через ткань, медленно, глядя в глаза. \"Вечером не засыпай\"."
log.answer.tease.let.public: "Ты не отстраняешься. Она сжимает ещё раз, уже не торопясь, и шепчет: \"Вечером не засыпай\"."
log.answer.tease.later: "\"Потом так потом\". Она убирает руку и поправляет фартук."
log.answer.comfort.comfort: "Ты обнимаешь её и слушаешь. Про гостей, про ноги, про то, что кофемашина опять течёт. Ей становится легче."
log.answer.comfort.later: "\"Потом\". Она кивает, не глядя, и встаёт."
log.her.stretch.20: "\"Знаешь, у меня там что-то изменилось\", - говорит она вечером. \"Раньше с тобой было плотнее\"."
log.her.stretch.20.thought: "Она замечает, что с мужем стало как-то свободнее. Раньше было плотнее."
log.her.stretch.45: "\"Я тебя почти не чувствую, когда ты входишь\", - говорит она. Без упрёка, как о погоде."
log.her.stretch.45.thought: "Она ловит себя на том, что почти не чувствует мужа внутри. И что ей это уже не странно."
log.her.stretch.70: "Она рассматривает себя в зеркале, раздвинув ноги. \"Смотри, что со мной стало. Это уже не закроется, да?\""
log.her.stretch.70.thought: "Она рассматривает себя в зеркале, пока мужа нет. Это уже не закроется. Она знает, от кого это."
log.her.stretch.90: "\"Туда теперь кулак войдёт, и я не замечу\", - говорит она спокойно. \"А ты спрашиваешь, почему я с тобой ничего не чувствую\"."
log.her.stretch.90.thought: "Туда теперь войдёт кулак, думает она. А муж всё ещё спрашивает, хорошо ли ей."
log.her.compare.1: "\"У него больше, чем у тебя\", - говорит она вечером. \"Ненамного. Но я почувствовала разницу\"."
log.her.compare.1.cruel: "\"У него больше. Ненамного, но тебе и этого хватило бы, чтобы я заметила\"."
log.her.compare.1.thought: "У него был больше, чем у мужа. Ненамного. Но она заметила разницу, и разница ей понравилась."
log.her.compare.2: "\"Я не знала, что бывает настолько больше\", - говорит она. \"Прости. Я просто говорю, как есть\"."
log.her.compare.2.cruel: "\"Рядом с ним твой как палец. Я не шучу, я сегодня сравнила\"."
log.her.compare.2.thought: "Она не знала, что бывает настолько больше. Рядом с этим муж как палец. Она старается об этом не думать, и думает."
log.her.compare.3: "\"После него я тебя вообще не почувствую\", - говорит она тихо. \"Я не жалуюсь. Просто знай\"."
log.her.compare.3.cruel: "\"После него в меня можно два твоих засунуть, и ещё место останется. Хочешь проверить?\""
log.her.compare.3.thought: "После такого мужа она просто не почувствует. Она это знает уже сейчас, ещё не дойдя до спальни."
log.her.his.20: "\"А ты быстро привыкаешь\", - говорит она, убирая игрушку. \"В первый раз так морщился, а теперь сам подаёшься\"."
log.her.his.20.cruel: "\"Смотри-ка, уже сам подаёшься навстречу. А говорил, что не твоё\"."
log.her.his.50: "\"Ты берёшь уже больше, чем я брала в первый год\", - говорит она с чем-то вроде уважения. \"Попробуем следующий размер?\""
log.her.his.50.cruel: "\"Ты берёшь уже больше, чем я брала в первый год. Мужик, ничего не скажешь. Следующий размер сам купишь\"."
log.her.his.80: "\"В тебя теперь входит то, что в меня не влезало\", - говорит она и смеётся. \"Кто бы мог подумать. Тебе же нравится, я вижу\"."
log.her.his.80.cruel: "\"В тебя теперь входит то, что в меня не влезало. Скажи спасибо, что я тобой занимаюсь\"."
ui.her.came: "Она подошла к тебе"
