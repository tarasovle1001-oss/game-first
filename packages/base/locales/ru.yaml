action.day.gym: "Качалка, один ({minutes} мин, {cost})"
action.day.gym_together: "Качалка вдвоём ({minutes} мин, {cost})"
log.gym.alone: "Полтора часа в качалке. Она в это время ходит по магазинам."
log.gym.together: "Вы идёте в качалку вдвоём. У входа расходитесь: мужская раздевалка налево, женская направо."
log.gym.locker.small.1: "В раздевалке ты стараешься не смотреть по сторонам. Всё равно видишь. У парня у соседнего шкафчика висит больше, чем у тебя стоит."
log.gym.locker.small.2: "В душе ты встаёшь лицом к стене. Двое рядом болтают о футболе, голые, ничего не прикрывая. Им нечего прикрывать."
log.gym.locker.small.3: "Ты переодеваешься быстро, обмотавшись полотенцем. Никто на тебя не смотрит. Ты смотришь на всех."
log.gym.locker.plain.1: "В раздевалке шумно, пахнет потом и гелем для душа. Обычные мужики, обычные разговоры."
log.gym.locker.plain.2: "В душе кто-то поёт. Ты ловишь себя на том, что сравниваешь. Вроде не хуже других."
log.gym.locker.plain.3: "Сосед по шкафчику рассказывает про свою машину. Ты киваешь и одеваешься."
log.gym.late: "Ты ждёшь её у входа лишних двадцать минут. Она выходит с мокрыми волосами: \"В душе была очередь\"."
log.gym.met.no: "У кулера к ней подошёл {name}. Она вежливо улыбнулась и ушла на дорожку."
log.gym.met.truth: "У кулера к ней подошёл {name}. Поговорили не только о тренировке ({act})."
log.gym.met.truth.long: "{name} тоже ходит сюда. Очереди в душе не было ({act})."
log.gym.met.open: "\"Там был {name}\", - говорит она по дороге домой. \"Мы немного поболтали\" ({act})."
log.gym.met.open.long: "Она выходит на двадцать минут позже, раскрасневшаяся. \"Там был {name}. Не спрашивай. Или спрашивай, я расскажу\" ({act})."
log.her.fit.20: "\"Ты что, в зал ходишь не зря?\" Она щупает твоё плечо. \"Мне нравится\"."
log.her.fit.20.cruel: "\"О, плечи появились\". Она щупает тебя, как товар на рынке. \"Продолжай\"."
log.her.fit.50: "Она смотрит, как ты снимаешь футболку, и не отворачивается. \"Иди сюда. Дай потрогать, что ты там накачал\"."
log.her.fit.50.cruel: "\"Хорошо выглядишь\", - говорит она, оглядев тебя с головы до ног. \"Жаль, там качалка не помогает\"."
log.her.fit.80: "\"На тебя в зале девчонки смотрят, я видела\", - говорит она и садится к тебе на колени. \"Пусть смотрят. Ты мой\"."
log.her.fit.80.cruel: "\"На тебя в зале девчонки смотрят\". Она усмехается. \"Знали бы они\"."
log.towels.hours: "Звонок сверху: полотенца в {room}. Она относит. Ты ложишься один. Она возвращается через {hours} ч. и молча ложится рядом."
log.towels.hours.truth: "{name} не отпускал её {hours} ч. Она и не просилась."
log.towels.hours.open: "Звонок сверху: {room}. \"Это {name}. Не жди меня\". Она возвращается через {hours} ч., пахнет чужим гелем для душа."
