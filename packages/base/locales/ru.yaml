log.bed.his.dildo_him: "Она водит игрушкой в тебе, не торопясь, второй рукой придерживая тебя за бедро. Ты кончаешь, не дотронувшись до себя. \"Вот так\", - говорит она."
log.bed.his.fisting_him: "Её рука в тебе по запястье. Она чуть поворачивает кисть, и ты кончаешь себе на живот. Она не вынимает руку, пока ты не перестаёшь дрожать."
log.bed.his.rimming_him: "Её язык сзади, её ладонь на члене. Тебя хватает ненадолго. Она вытирает губы и смотрит на тебя снизу вверх."
log.bed.her.rimming_her: "Она кончает, уткнувшись лицом в подушку, от одного твоего языка сзади. Потом долго лежит, не разжимая пальцев на простыне."
log.night.counter.dildo_him: "\"Нет\". Она достаёт из ящика игрушку и смазку. \"На четвереньки. Сегодня я посмотрю, сколько в тебя влезет\"."
log.night.counter.fisting_him: "\"Нет\". Она медленно натягивает перчатку до локтя. \"Ты уже достаточно разработан. Сегодня будет рука. Целиком\"."
