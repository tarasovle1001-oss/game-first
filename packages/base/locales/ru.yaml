log.her.starts.close: "Она сама подходит к {name}, без заказа. Он не успевает ничего сказать, она уже рядом."
log.her.starts.takes: "Она сама берёт {name} за руку и кивает в сторону двери. Он встаёт сразу."
log.enc.she_steers: "Ей этого мало. Она сама меняет положение и показывает {name}, чего хочет: {act}."
log.enc.she_bored: "Ей скучно, и она этого не скрывает. Она отстраняется от {name}: \"Мне пора в зал\"."
