# her head
thought.anger.1: "\"Он вообще меня слышит?\""
thought.anger.2: "\"Ещё раз так сделает - я не промолчу.\""
thought.anger.3: "\"Злюсь. И он даже не заметил.\""
thought.contempt.1: "\"И это мой муж.\""
thought.contempt.2: "\"Раньше я этого не замечала. Теперь не развидеть.\""
thought.contempt.3: "\"Мог бы хоть попытаться.\""
thought.guilt.1: "\"Он ничего не знает. От этого только хуже.\""
thought.guilt.2: "\"Зачем я это сделала.\""
thought.guilt.3: "\"Надо было остановиться раньше.\""
thought.shame.1: "\"Все же видели.\""
thought.shame.2: "\"Щёки горят. Только бы никто не смотрел.\""
thought.shame.3: "\"Как я теперь выйду в зал.\""
thought.longing.1: "\"Мне этого мало.\""
thought.longing.2: "\"Когда меня в последний раз просто хотели?\""
thought.longing.3: "\"Лежу и думаю не о том, о чём положено.\""
thought.disgust.1: "\"Руки бы после него помыть.\""
thought.disgust.2: "\"Меня от него передёргивает.\""
thought.disgust.3: "\"Только не это. Только не он.\""
thought.fear.1: "\"Он же не отстанет.\""
thought.fear.2: "\"Сердце колотится. Где муж?\""
thought.fear.3: "\"Надо было уйти сразу.\""
thought.pride.1: "\"Могу сказать нет. И сказала.\""
thought.pride.2: "\"Я всё ещё решаю сама.\""
thought.pride.3: "\"Смотрят. Пусть смотрят.\""
thought.tenderness.1: "\"Всё-таки он у меня хороший.\""
thought.tenderness.2: "\"С ним тепло. Это никуда не делось.\""
thought.tenderness.3: "\"Надо будет его обнять.\""
thought.delight.1: "\"Господи, как хорошо.\""
thought.delight.2: "\"Ещё. Хочу ещё.\""
thought.delight.3: "\"Вот ради такого и стоит жить.\""
thought.morning.quiet.1: "\"Обычный был день. Наверное, это хорошо.\""
thought.morning.quiet.2: "\"Вчера ничего не случилось. И я не знаю, рада ли.\""
thought.morning.quiet.3: "\"Ещё один день как все.\""
thought.morning.guest.1: "\"Вчера я зашла дальше, чем собиралась. И мне не стыдно.\""
thought.morning.guest.2: "\"Он так на меня смотрел. Я до сих пор это чувствую.\""
thought.morning.guest.3: "\"Интересно, придёт ли он сегодня.\""
thought.morning.guest_guilty.1: "\"Что я вчера натворила.\""
thought.morning.guest_guilty.2: "\"Не могу смотреть мужу в глаза.\""
thought.morning.guest_guilty.3: "\"Этого не должно повториться. Наверное.\""
thought.morning.husband_good.1: "\"Вчера с ним было хорошо. Давно так не было.\""
thought.morning.husband_good.2: "\"Проснулась и улыбаюсь. Глупо, но приятно.\""
thought.morning.husband_good.3: "\"Может, у нас всё не так плохо.\""
thought.morning.husband_bad.1: "\"Он уснул довольный. А я?\""
thought.morning.husband_bad.2: "\"Опять осталась ни с чем.\""
thought.morning.husband_bad.3: "\"Он старался. Наверное. Мне от этого не легче.\""
thought.morning.both.1: "\"Вчера было двое. Сравнивать нехорошо. Но я сравниваю.\""
thought.morning.both.2: "\"После него муж показался другим.\""
thought.morning.both.3: "\"Легла с мужем, а думала о другом.\""
