# Economy and pacing numbers. Change here, not in code.
start:
  money: 400
  debt: 6000
  reputation: 40
  stock: 30
rentPerDay: 380
purse: # tips the men leave her for more than coffee: part goes into her purse, the rest into the till
  shares: [0, 0.25, 0.5, 1] # what the husband can let her keep
  start: 0.5
  moodAtNone: -3   # her mood per day when she keeps nothing of what she earned
  moodAtAll: 2
  actTipScale: 0.6 # overall size of those tips
trouble: # things break, and an unwatched till gets robbed
  breakdownChancePerDay: 0.07
  breakdownCost: [120, 420]
  tillTheftChancePerTick: 0.05 # per 10 minutes while she is away in a back room and he cannot see the hall
  tillTheftShare: [10, 30]     # percent of tonight's takings
debtLimit: 20000 # supplies can be bought on credit until the debt reaches this
debtInterestPerDay: 0.008 # fraction of the debt added every day
supplies:
  packCost: 60
  packServings: 12
heroine: # how her state settles during the evening, per 10 minutes
  arousalCoolPerTick: 0.35
  moodSettlePerTick: 0.02
  soberPerTick: 0.6
clock: # minute of the day each phase starts at
  prep: 960     # 16:00
  night: 30     # 00:30
  summary: 60   # 01:00
shift:
  opensAt: 18
  hours: 6
  minutesPerTick: 10
  seats: 8
  arrivalsPerHour: 1.9 # expected new guests per hour at reputation 50
  stayMinutes: [50, 130]
  orderEveryMinutes: 35 # a guest wants a new order this often
  maxWaitMinutes: 45 # he walks out after waiting this long
  energyPerServe: 2
  regularAfterVisits: 3
  returnChance: 0.6 # chance that an arriving guest has been here before
  # where the husband spends the evening changes what the cafe earns (and what he can see)
  husbandInHallServesEvery: 2 # in the hall he takes an order himself every N ticks
  husbandInKitchenBill: 0.3   # in the kitchen: share added to every bill, the food is better
  husbandAtBarTip: 0.3        # behind the bar: share added to tips
