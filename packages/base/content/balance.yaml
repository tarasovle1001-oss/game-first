# Economy and pacing numbers. Change here, not in code.
start:
  money: 400
  debt: 6000
  reputation: 40
  stock: 30
rentPerDay: 560
rentGrowthPerWeek: 40 # the landlord puts it up every week
purse: # tips the men leave her for more than coffee: part goes into her purse, the rest into the till
  shares: [0, 0.25, 0.5, 1] # what the husband can let her keep
  start: 0.5
  moodAtNone: -3   # her mood per day when she keeps nothing of what she earned
  moodAtAll: 2
  actTipScale: 0.6 # overall size of those tips
trouble: # things break, and an unwatched till gets robbed
  breakdownChancePerDay: 0.07
  breakdownCost: [120, 420]
  tillTheftChancePerTick: 0.05 # per 10 minutes while she is away in a back room and he cannot see the hall
  tillTheftShare: [10, 30]     # percent of tonight's takings
debtLimit: 20000 # supplies can be bought on credit until the debt reaches this
debtInterestPerDay: 0.008 # fraction of the debt added every day
supplies:
  packCost: 60
  packServings: 12
heroine: # how her state settles during the evening, per 10 minutes
  arousalCoolPerTick: 0.35
  moodSettlePerTick: 0.02
  soberPerTick: 0.6
clock: # minute of the day each phase starts at
  prep: 720     # 12:00 (the afternoon system counts down from here to opening)
  night: 30     # 00:30
  summary: 60   # 01:00
loan: # the debt is paid in instalments; miss one and the lender starts dropping by
  everyDays: 7
  firstDueDay: 7
  share: 0.15         # of what is owed
  min: 500
  lateFee: 0.15       # of the missed instalment, added to the debt
  visitsAfterMiss: 3  # evenings he comes by after a missed date
  forgivePerTier: 45  # what he writes off for what she gives him, per tier of the act
  consent: 10         # how much the debt argues for him, at the starting debt
  suspicion: 7        # the book shows less than it should
  lender: { size: 18, persistence: 85, generosity: 45, interest: 55, arrivesAtTick: 8 }
hotel: # two rooms upstairs
  roomPrice: 55
  takeChance: 0.35      # per free room per evening, at reputation 50
  returningChance: 0.5  # a known face rather than a stranger
  nights: [1, 3]
  comesDownAtTick: 4
  towels: { interest: 45, chance: 0.4, maxTier: 6, hoursAffinity: 35, hoursChance: 0.6, hoursEnergy: 8, hoursSuspicion: 4, hoursPower: 3 } # after closing he rings down for towels; she takes them up
  nightVisitTier: 5     # how far it must have gone for her to go up to him at night
shift:
  opensAt: 18
  hours: 6
  minutesPerTick: 1    # the evening is counted in minutes; slow things still run every 10 (event shift:tick)
  seats: 8
  arrivalsPerHour: 1.9 # expected new guests per hour at reputation 50
  stayMinutes: [50, 130]
  orderEveryMinutes: 35 # a guest wants a new order this often
  maxWaitMinutes: 45 # he walks out after waiting this long
  energyPerServe: 2
  regularAfterVisits: 3
  returnChance: 0.6 # chance that an arriving guest has been here before
  # where the husband spends the evening changes what the cafe earns (and what he can see)
  serveMinutes: 6            # how long one order keeps her busy
  husbandServeMinutes: 3     # his own time when he takes a table himself
  husbandInKitchenBill: 0.3   # in the kitchen: share added to every bill, the food is better
  husbandAtBarTip: 0.3        # behind the bar: share added to tips
