# What goes into the picture prompt besides the state of the game (look.yaml has the words for clothes, face,
# marks, room and act). Filled in by hand or by an outside helper: `pnpm slots export` writes the empty slots with
# context, `pnpm slots merge <file>` takes the answer back, `pnpm slots check` lints. Empty = not filled yet.
#
# Each figure gets its own prompt (regional / masked conditioning), so what the guest is never leaks into her.
# Counts (1girl, 2boys...) are added by the code; do not write them here.
style:
  prefix: ""        # quality / style tags for the checkpoint, go first in the shared prompt
  negative: ""      # shared negative
roles:              # who the figure is; appearance only, no pose
  wife: { who: "adult woman", negative: "" }
  husband: { who: "adult man", negative: "" }
  patron: { who: "adult man", negative: "" }
  patron2: { who: "adult man", negative: "" }
  patron3: { who: "adult man", negative: "" }
  watcher: { who: "adult man, background figure", negative: "" }
# per scene layout: "scene" = shared words for the whole frame (composition, camera, what is going on between them),
