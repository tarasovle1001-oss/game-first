# Rooms of one zone. Links must be listed on both sides (the build checks it).
# map: position on the building plan (x, y, w, h in cells); y 0 = upstairs, y 1 = ground floor.
# sees: rooms in plain view from here. From behind the bar he sees the hall, and she knows it.
zone: cafe
rooms:
  - id: cafe.hall
    links: [cafe.bar, cafe.toilet, cafe.lounge, cafe.sauna, home.bedroom, hotel.landing, town.square]
    tags: [public, work]
    sees: [cafe.bar]
    map: { x: 1, y: 1, w: 2, h: 1 }
  - id: cafe.bar
    links: [cafe.hall, cafe.kitchen]
    tags: [public, work]
    sees: [cafe.hall]
    map: { x: 3, y: 1, w: 1, h: 1 }
  - id: cafe.kitchen
    links: [cafe.bar, cafe.staff]
    tags: [staff, work]
    map: { x: 4, y: 1, w: 1, h: 1 }
  - id: cafe.staff
    links: [cafe.kitchen]
    tags: [staff, private]
    map: { x: 5, y: 1, w: 1, h: 1 }
  - id: cafe.toilet
    links: [cafe.hall]
    tags: [public, private]
    map: { x: 0, y: 1, w: 1, h: 1 }
  - id: cafe.lounge          # the back room a company can take for the evening; a closed door
    links: [cafe.hall]
    tags: [public, work]
    map: { x: 6, y: 1, w: 1, h: 1 }
  - id: cafe.sauna           # built as an upgrade: a company can take it instead of the back room
    links: [cafe.hall]
    tags: [public, work]
    map: { x: 7, y: 1, w: 1, h: 1 }
