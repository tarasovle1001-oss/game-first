# The afternoon before opening: a budget of minutes and things to spend it on.
minutes: 360          # from noon to opening
dirtPerServed: 1.0    # cleanliness lost per guest served
cleanStart: 70
clean:                # how the state of the room shows in the evening
  tipShare: 0.2       # share of the bill added to tips at 100, taken away at 0
  dirtyBelow: 30      # below this the place loses reputation every evening
  dirtyReputation: 1
activities:           # each once a day
  - { id: clean, minutes: 60, clean: 45 }
  - { id: flyers, minutes: 60, cost: 40, arrivals: 0.2 }
  - { id: side_job, minutes: 240, money: 70 }
  - { id: her_chores, minutes: 60, her: { energy: 14, mood: 2, resent: -1 } }
  - { id: town, minutes: 60 }             # go to town together: opens the shops and the walk for today
  - { id: date, minutes: 90, cost: 40, needs: town, her: { mood: 6, desire: 3, resent: -2 } }
shop:                 # in town; she also buys for herself from her purse
  toys:               # size in cm; she uses the biggest one she can take when a night leaves her wanting
    - { id: toy_small, size: 14, price: 90 }
    - { id: toy_big, size: 18, price: 160 }
    - { id: toy_huge, size: 23, price: 260 }
  toyStretchAbove: 4  # she buys a toy at most this much above what she takes comfortably
  toySatisfied: 80
  gigolo: { price: 250, size: 24, minutes: 40, fidelityBelow: 45, sizeTasteFrom: 45, chance: 0.5, suspicion: 4 }
  herOutfitMargin: 5  # she buys an outfit herself once her openness is this close to it
upgrades:             # one-off, paid from the till (or on credit while the limit allows)
  - { id: coffee_machine, cost: 600, bill: 0.15 }
  - { id: interior, cost: 900, tip: 0.1, reputation: 5 }
  - { id: soundproof, cost: 500 }         # the staff room door: nothing is heard from the kitchen any more
