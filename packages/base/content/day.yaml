# The afternoon before opening: a budget of minutes and things to spend it on.
minutes: 360          # from noon to opening
dirtPerServed: 1.0    # cleanliness lost per guest served
cleanStart: 70
clean:                # how the state of the room shows in the evening
  tipShare: 0.2       # share of the bill added to tips at 100, taken away at 0
  dirtyBelow: 30      # below this the place loses reputation every evening
  dirtyReputation: 1
activities:           # each once a day; at: cafe = at home, or the one place in town where it is done
  - { id: clean, energy: 14, minutes: 60, clean: 45, at: cafe, gradual: true } # gradual: every minute counts at once (0.75 a minute), can be dropped and taken up again
  - { id: her_chores, energy: 8, minutes: 60, withHer: true, at: cafe, gradual: true, her: { energy: 14, mood: 2, resent: -1 } } # five minutes of it is 5/60 of what it gives her
  - { id: flyers, energy: 10, minutes: 60, cost: 40, arrivals: 0.2, at: town.square }
  - { id: side_job, energy: 32, minutes: 240, money: 70, at: town.square }
  - { id: ask_around, energy: 3, minutes: 60, cost: 15, gossip: true, at: town.square } # a beer with the men who drink at your place: what do they say
  - { id: date, energy: 5, minutes: 90, cost: 40, withHer: true, at: town.square, her: { mood: 6, desire: 3, resent: -2 } }
  - { id: market, energy: 6, minutes: 30, cost: 45, stock: 14, at: town.market }   # cheaper than the supplier
  - { id: gym, energy: 20, minutes: 90, cost: 20, gym: alone, at: town.gym }
  - { id: gym_together, energy: 20, minutes: 90, cost: 35, withHer: true, gym: together, at: town.gym, her: { mood: 3, energy: -8 } } # the changing rooms are separate
  - { id: sit_together, energy: -2, minutes: 30, withHer: true, at: cafe, her: { mood: 3, desire: 1 } }
  - { id: nap, energy: -24, minutes: 60, at: cafe }   # an hour on the bed
herDay:               # her own afternoon: one task after another, each in its room
  walkToTown: 10      # minutes between the cafe and the square
  walkInTown: 3
  shopping: { boldOpenness: 50, minutes: 60, tryOn: 6, mood: 2 } # she comes to the shops with him: how long she stays, how much trying things on eases the openness an outfit needs, what the outing is worth
  awayMinutes: 150    # when she is out on her own
  trips: [town.shops, town.market, town.gym] # where she goes on an errand, or says she goes
  tripChance: 0.22    # per change of task, once a day
  tripMinutes: [60, 100]
  notThereSuspicion: 8 # he walks into the place she named and she is not there
  tasks:
    - { id: cook, loc: cafe.kitchen, minutes: [30, 60] }
    - { id: tidy, loc: cafe.hall, minutes: [20, 40], clean: 6 }
    - { id: bar, loc: cafe.bar, minutes: [15, 30] }
    - { id: wash, loc: home.bathroom, minutes: [20, 35], her: { mood: 2 } }
    - { id: rest, loc: home.bedroom, minutes: [20, 45], her: { energy: 5 } }
    - { id: dress, loc: home.bedroom, minutes: [10, 20] }
gym:
  fitness: 3            # what one session gives him, 0..100
  minutesPerSession: 0.1  # he lasts a little longer for it
  minutesMax: 4         # at most this much above where he started
  herDesireSteps: [20, 50, 80] # she notices, and says so
  herDesire: 2          # what noticing does for her wanting him
  lockerChance: 0.5     # in the men's changing room he sees what other men have
  meetChance: 0.45      # a regular of the cafe trains here too and finds her
  meetAffinity: 15      # how much she has to like him for it to be him
  maxTier: 7
  lateSuspicion: 3
shop:                 # in town; she also buys for herself from her purse
  toys:               # size in cm; she uses the biggest one she can take when a night leaves her wanting
    - { id: toy_plug, size: 9, price: 40 }      # small ones: of no use to her, a start for him
    - { id: toy_slim, size: 11, price: 60 }
    - { id: toy_small, size: 14, price: 90 }
    - { id: toy_16, size: 16, price: 120 }
    - { id: toy_big, size: 18, price: 160 }
    - { id: toy_20, size: 20, price: 200 }
    - { id: toy_huge, size: 23, price: 260 }
    - { id: toy_26, size: 26, price: 300 }
    - { id: toy_28, size: 28, price: 340 }
    - { id: toy_31, size: 31, price: 380 }
    - { id: toy_34, size: 34, price: 420 }
    - { id: toy_37, size: 37, price: 470 }
    - { id: toy_40, size: 40, price: 520 }
    - { id: toy_44, size: 44, price: 600 }
    - { id: toy_48, size: 48, price: 700 }
  browse: { toysBase: 0.1, perTaste: 0.006, perFrustration: 0.004, failed: 0.3, toysMax: 0.85, buyTaste: 30, outfit: 0.5 } # she walks round the shops: the chance the toy shop draws her (taste for size, wanting, a size she could not take), from which taste she buys without another reason, how often a dress catches her eye otherwise
  toyStretchAbove: 4  # she buys a toy at most this much above what she takes comfortably
  toySatisfied: 80
  solo: # her own drawer: what she buys and uses by herself
    at: 15          # frustration from which she shuts herself in before opening
    window: [0.45, 0.85] # when in the afternoon: between these shares of it still ahead (early, before he thinks of opening)
    idleBase: 0.1   # with a toy in the drawer: chance a day that she uses it without being driven to it...
    idlePerLibido: 0.006 # ...plus this per point of her libido (a quiet wife about twice a week, a hungry one every other day)
    idlePerFrustration: 0.006 # ...plus this per point of frustration, below "at"
    train: 0.35     # ...and this when there is a size she tried and could not take: she works toward it
    fingersShare: 0.8 # with no toy yet she still does it with her fingers, this share as often
    minutes: [20, 40] # how long she is behind the bedroom door
    watchOpenness: 65 # he walks in: from this openness (or warm and worked up, or in the open) she goes on and lets him look
    interrupted: { resent: 1, mood: -3 } # otherwise she shouts that she is changing, and is cross for a while
    buyAt: 12       # frustration from which she buys her first one; half of it is enough for the next size
    firstSize: 11   # nothing smaller is worth her money
    outgrown: 2     # she wants the next size once she takes comfortably within this many cm of her biggest
    relief: 25      # frustration a session with a toy takes off (half with fingers only)
    curious: { sizeTaste: 45, chance: 0.2, seen: 0.25 } # she buys one (or the next size) out of curiosity too: per morning, with a taste for size from this; `seen` is added once she has seen a man far bigger than her husband
    fantasy: { openness: 0.7, fidelity: 0.5, sizeTaste: 0.8, fingersShare: 0.6 } # what a session moves in her when she thinks of someone who is not her husband (with fingers only: this share)
    analChance: 0.35 # how often it is the back way, once she has a taste for it
    analTaughtAt: 6      # stretch there from which it is hers (was 15: out of reach on her own)
    analCuriousFrom: 45  # her anal taste at setup from which she tries it on her own with a small toy
    analCuriousShare: 1.0 # ...this share of analChance (scaled by that taste: 50 -> x1, 80 -> x1.6)
  gigolo: { price: 250, size: 40, minutes: 40, fidelityBelow: 45, sizeTasteFrom: 45, chance: 0.5, suspicion: 4 }
  affair: { fidelityBelow: 50, affinity: 30, chance: 0.3, minutes: 120, suspicion: 3 } # an afternoon "with a friend" with a lover who has her number
  herOutfitMargin: 5  # she buys an outfit herself once her openness is this close to it
leftHer: { mood: -4, resent: 1.5 } # he walks off in the middle of an outing with her
upgrades:             # one-off, paid from the till (or on credit while the limit allows)
  - { id: coffee_machine, cost: 600, bill: 0.15 }
  - { id: interior, cost: 900, tip: 0.1, reputation: 5 }
  - { id: sauna, cost: 800 }              # a sauna off the hall: companies book it, and nobody sees in
  - { id: soundproof, cost: 500 }         # the staff room door: nothing is heard from the kitchen any more

rhythm:               # the day around the clock: sleep, his own state, the bathroom, money on the mind
  wake: [9, 10, 12]   # he may sleep till; the first is the default
  herWake: 9
  energyPerHour: { him: 12, her: 12 }
  collapse: { after: 2, minutes: 240, energy: 40 } # with nothing left for this many ten-minute steps he drops and sleeps this long (the hall is hers meanwhile); what it gives back
  sleep: { fullAfter: 4, shortShare: 0.45 } # the first hours of sleep give back this share of an hour each: 4 to 9 is ~ 41, 2 to 10 is ~ 77
  energyCost: 0.75    # everything that tires either of them costs this share of its listed price (one knob for "energy runs out too fast")
  quiet: { minutes: 60, her: 22 } # at zero energy in the afternoon either of them lies down: for how long, and what it gives her (his is the nap)
  herBedtime: 60      # minutes after midnight she is asleep, if nothing keeps her up
  wakeHer: { consent: -15, annoy: 10, mood: -3, tiredEnergy: 35, warmDesire: 55 } # below tiredEnergy she waves him off and sleeps on; from warmDesire she does not mind being woken
  nightWaits: [5, 15, 60]
  nightUntilMax: 180  # "until something happens" at night gives up after this many minutes
  nightCosts: { ask: 5, turn: 2, self: 10, talk: 5 }
  him:
    start: { energy: 85, mood: 60, arousal: 10 }
    moodRest: 55
    arousalRest: 15
    settle: 0.3
    shiftPerTick: 0.6   # 36 ticks an evening
    serve: 0.5
    bed: 5
    tiredBelow: 15
    tiredMood: -3
    softTired: 0.08
    arousal: { watch: 4, bare: 2, touch: 4, carried: 10, startHis: 0.25 }
    mood: { came: 4, refused: -3, talkLow: 0.7, talkHigh: 1.15, toHer: 0.1 }
  # debt is counted over the loan they started with
  worry: { cashBelow: 150, debtFrom: 400, mood: -3, hardDebt: 1500, hardMood: -6, herShare: 0.6 }
  bath: { steps: { minutes: 4, soap: 4, closer: 7, hers: 12, closerDesire: 40, hersDesire: 55 }, washMinutes: 15, washMood: 2, washEnergy: 7, napMinutes: 45, napEnergy: 18, sendMinutes: 20, sendAnnoy: 3, walkIn: { margin: 30, arousal: 8, annoy: 8 } }
world:                # the week and the sky: more people on some days, fewer on others
  weekdays: [0, -0.1, 0, 0, 0.05, 0.25, 0.2]   # Sunday first: share added to the evening's flow
  weather:
    - { id: clear, weight: 5, arrivals: 0 }
    - { id: rain, weight: 2, arrivals: -0.15 }
    - { id: heat, weight: 1, arrivals: 0.1 }
    - { id: cold, weight: 1, arrivals: -0.08 }
    - { id: storm, weight: 0.5, arrivals: -0.3 }
  famePerRegular: 2
  famePerDay: 0.3
  fameArrivals: 0.002  # per point of fame
  fameTiers: [[0, nobody], [20, known], [45, talked], [70, famous], [90, legend]]
