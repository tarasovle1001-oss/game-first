# The afternoon before opening: a budget of minutes and things to spend it on.
minutes: 360          # from noon to opening
dirtPerServed: 1.0    # cleanliness lost per guest served
cleanStart: 70
clean:                # how the state of the room shows in the evening
  tipShare: 0.2       # share of the bill added to tips at 100, taken away at 0
  dirtyBelow: 30      # below this the place loses reputation every evening
  dirtyReputation: 1
activities:           # each once a day; at: cafe = at home, or the one place in town where it is done
  - { id: clean, energy: 14, minutes: 60, clean: 45, at: cafe, gradual: true } # gradual: every minute counts at once (0.75 a minute), can be dropped and taken up again
  - { id: her_chores, energy: 8, minutes: 60, withHer: true, at: cafe, her: { energy: 14, mood: 2, resent: -1 } }
  - { id: flyers, energy: 10, minutes: 60, cost: 40, arrivals: 0.2, at: town.square }
  - { id: side_job, energy: 32, minutes: 240, money: 70, at: town.square }
  - { id: ask_around, energy: 3, minutes: 60, cost: 15, gossip: true, at: town.square } # a beer with the men who drink at your place: what do they say
  - { id: date, energy: 5, minutes: 90, cost: 40, withHer: true, at: town.square, her: { mood: 6, desire: 3, resent: -2 } }
  - { id: market, energy: 6, minutes: 30, cost: 45, stock: 14, at: town.market }   # cheaper than the supplier
  - { id: gym, energy: 20, minutes: 90, cost: 20, gym: alone, at: town.gym }
  - { id: gym_together, energy: 20, minutes: 90, cost: 35, withHer: true, gym: together, at: town.gym, her: { mood: 3, energy: -8 } } # the changing rooms are separate
  - { id: sit_together, energy: -2, minutes: 30, withHer: true, at: cafe, her: { mood: 3, desire: 1 } }
  - { id: nap, energy: -14, minutes: 60, at: cafe }   # an hour on the bed
herDay:               # her own afternoon: one task after another, each in its room
  walkToTown: 10      # minutes between the cafe and the square
  walkInTown: 3
  shopping: { minutes: 60, tryOn: 6, mood: 2 } # she comes to the shops with him: how long she stays, how much trying things on eases the openness an outfit needs, what the outing is worth
  awayMinutes: 150    # when she is out on her own
  trips: [town.shops, town.market, town.gym] # where she goes on an errand, or says she goes
  tripChance: 0.12    # per change of task, once a day
  tripMinutes: [60, 100]
  notThereSuspicion: 8 # he walks into the place she named and she is not there
  tasks:
    - { id: cook, loc: cafe.kitchen, minutes: [30, 60] }
    - { id: tidy, loc: cafe.hall, minutes: [20, 40], clean: 6 }
    - { id: bar, loc: cafe.bar, minutes: [15, 30] }
    - { id: wash, loc: home.bathroom, minutes: [20, 35], her: { mood: 2 } }
    - { id: rest, loc: home.bedroom, minutes: [20, 45], her: { energy: 5 } }
    - { id: dress, loc: home.bedroom, minutes: [10, 20] }
gym:
  fitness: 3            # what one session gives him, 0..100
  minutesPerSession: 0.1  # he lasts a little longer for it
  minutesMax: 4         # at most this much above where he started
  herDesireSteps: [20, 50, 80] # she notices, and says so
  herDesire: 2          # what noticing does for her wanting him
  lockerChance: 0.5     # in the men's changing room he sees what other men have
  meetChance: 0.45      # a regular of the cafe trains here too and finds her
  meetAffinity: 15      # how much she has to like him for it to be him
  maxTier: 7
  lateSuspicion: 3
shop:                 # in town; she also buys for herself from her purse
  toys:               # size in cm; she uses the biggest one she can take when a night leaves her wanting
    - { id: toy_plug, size: 9, price: 40 }      # small ones: of no use to her, a start for him
    - { id: toy_slim, size: 11, price: 60 }
    - { id: toy_small, size: 14, price: 90 }
    - { id: toy_big, size: 18, price: 160 }
    - { id: toy_huge, size: 23, price: 260 }
    - { id: toy_28, size: 28, price: 340 }
    - { id: toy_34, size: 34, price: 420 }
    - { id: toy_40, size: 40, price: 520 }
  toyStretchAbove: 4  # she buys a toy at most this much above what she takes comfortably
  toySatisfied: 80
  gigolo: { price: 250, size: 24, minutes: 40, fidelityBelow: 45, sizeTasteFrom: 45, chance: 0.5, suspicion: 4 }
  affair: { fidelityBelow: 50, affinity: 30, chance: 0.3, minutes: 120, suspicion: 3 } # an afternoon "with a friend" with a lover who has her number
  herOutfitMargin: 5  # she buys an outfit herself once her openness is this close to it
upgrades:             # one-off, paid from the till (or on credit while the limit allows)
  - { id: coffee_machine, cost: 600, bill: 0.15 }
  - { id: interior, cost: 900, tip: 0.1, reputation: 5 }
  - { id: sauna, cost: 800 }              # a sauna off the hall: companies book it, and nobody sees in
  - { id: soundproof, cost: 500 }         # the staff room door: nothing is heard from the kitchen any more

rhythm:               # the day around the clock: sleep, his own state, the bathroom, money on the mind
  wake: [8, 10, 12]   # he may sleep till; the first is the default
  herWake: 8
  energyPerHour: { him: 9, her: 9 }
  herBedtime: 60      # minutes after midnight she is asleep, if nothing keeps her up
  wakeHer: { consent: -15, annoy: 10, mood: -3 }
  nightWaits: [15, 60]
  nightCosts: { ask: 5, turn: 2, self: 10, talk: 5 }
  him:
    start: { energy: 85, mood: 60, arousal: 10 }
    moodRest: 55
    arousalRest: 15
    settle: 0.3
    shiftPerTick: 0.6   # 36 ticks an evening
    serve: 0.5
    bed: 5
    tiredBelow: 15
    tiredMood: -3
    softTired: 0.08
    arousal: { watch: 4, bare: 2, touch: 4, carried: 10, startHis: 0.25 }
    mood: { came: 4, refused: -3, talkLow: 0.7, talkHigh: 1.15, toHer: 0.1 }
  # debt is counted over the loan they started with
  worry: { cashBelow: 150, debtFrom: 400, mood: -3, hardDebt: 1500, hardMood: -6, herShare: 0.6 }
  bath: { washMinutes: 15, washMood: 2, sendMinutes: 20, sendAnnoy: 3, walkIn: { margin: 30, arousal: 8, annoy: 8 } }
world:                # the week and the sky: more people on some days, fewer on others
  weekdays: [0, -0.1, 0, 0, 0.05, 0.25, 0.2]   # Sunday first: share added to the evening's flow
  weather:
    - { id: clear, weight: 5, arrivals: 0 }
    - { id: rain, weight: 2, arrivals: -0.15 }
    - { id: heat, weight: 1, arrivals: 0.1 }
    - { id: cold, weight: 1, arrivals: -0.08 }
    - { id: storm, weight: 0.5, arrivals: -0.3 }
  famePerRegular: 3
  famePerDay: 0.5
  fameArrivals: 0.002  # per point of fame
  fameTiers: [[0, nobody], [20, known], [45, talked], [70, famous], [90, legend]]
