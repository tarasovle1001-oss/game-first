# Tuning of the consent formula. Every number here is a visible row in the debug panel.
eagerAt: 20      # total >= this: she is glad to
hesitantAt: 0    # total >= this: she agrees, reluctantly; below: she refuses
hesitantYesAtZero: 0.5 # when she hesitates it can go either way: this chance at total 0, rising to certain at eagerAt
inPlainSight: 45       # how much harder an intimate act is on the cafe floor than in a back room
expect: # what she thinks her husband allows: -100 he made clear he does not want it ... +100 he said yes
  unknown: -30      # an act she has no idea about: she assumes he would rather not
  ignoreGain: 18    # he watched and said nothing
  ignoreCap: 55     # silence alone never makes her sure
  approve: 80       # he told her he does not mind
  forbid: -90       # he stepped in
  forbidHigher: -50 # ...and that tells her about everything beyond it too
  friendly: 12      # "be nice to the guests" (acts up to touching)
  reserved: -20     # "keep your distance" (everything)
  behindBack: 28    # how much a believed "no" holds her back when he is not looking, times her honesty
  permission: 12    # how much a believed "yes" helps, anywhere
proposalsPerTick: 3 # how many guests can speak up within one tick (only one of them can take her off the floor)
askChancePerHour: 0.5 # base chance that a guest makes a move within an hour
askChancePerInterest: 0.016 # added per point of his interest

# row weights
arousal: 0.6    # per point of arousal, grows with the tier of the act
drunk: 0.35      # per point of drunkenness
mood: 0.2        # per point of mood above 50
openness: 0.5    # per point of openness above 50, grows with the tier
fidelity: 0.5   # per point of fidelity, grows with the tier (always against)
libido: 0.3      # per point of libido above 50, intimate acts only
affinity: 0.35   # per point of her opinion of him
charm: 0.25      # per point of his charm above 50
familiar: 14     # she has already done this with him
jumpPerTier: 14  # per tier he tries to skip with her
witnesses: 0.15   # other guests can see, scaled by how closed she is
husbandWatching: 38 # her husband is in the room
money: 0.3       # per unit of money offered, scaled by how badly they need it
pressure: 0.25   # he insists: his persistence against her confidence
tired: 15        # she has no energy left
satisfied: 0.25  # per point of "just had her fill", intimate acts only
size: 2.2        # per cm of his size above what she takes comfortably, scaled by her taste for size
sizeCap: 16
desire: 0.6      # husband only: per point of her desire for him above 50
resent: 0.6      # husband only: per point of her resentment

# how fast her character moves when she says yes (per tier of the act)
drift:
  openness: 0.12
  fidelity: 0.1
  confidence: 0.05
