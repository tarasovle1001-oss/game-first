# The floor: small things at the tables, guests who go to the husband first, companies in the back room,
# sitting down with a guest, joining her.
moments:              # small things at a table; none of them is an "act"
  chancePerTick: 0.3  # per ten minutes, one table at most
  likeAffinity: 15    # she takes it well from a man she likes this much (unless the moment says otherwise)
  list:
    # when: regular, newcomer, approach, minInterest, minDrunk, minGenerosity, minAffinity, needOpen (her openness to take it well)
    - { id: remembers_name, when: { regular: true }, good: { affinity: 3, mood: 1 } }
    - { id: asks_name, when: { newcomer: true }, good: { affinity: 1 } }
    - { id: big_tip, when: { minGenerosity: 60 }, good: { affinity: 2, tip: 9, pride: 2 } }
    - { id: invites_drink, when: { minDrunk: 25 }, needOpen: 35, good: { affinity: 2, drunk: 6, mood: 1 }, bad: { annoy: 2 } }
    - { id: leans_close, when: { minInterest: 40 }, good: { arousal: 2, affinity: 1 }, bad: { annoy: 3, affinity: -1 } }
    - { id: stares, when: { minInterest: 30 }, needOpen: 55, likeAffinity: -100, good: { arousal: 2, heat: 6 }, bad: { annoy: 1.5, heat: 6 } }
    - { id: praises_work, when: {}, likeAffinity: -100, good: { mood: 2, affinity: 2 } }
    - { id: crude_joke, when: { minDrunk: 45 }, needOpen: 60, good: { mood: 1, arousal: 1 }, bad: { annoy: 4, affinity: -2 } }
    - { id: asks_husband, when: { regular: true }, likeAffinity: -100, good: { affinity: 1 }, secret: { guilt: 4 } }
    - { id: brushes_hand, when: { minInterest: 35 }, good: { arousal: 1.5, affinity: 1 }, bad: { annoy: 2 } }
    - { id: complains_slow, when: { waiting: true }, likeAffinity: 200, bad: { mood: -2, annoy: 2 } }
    - { id: tells_story, when: { approach: court }, likeAffinity: -100, good: { mood: 2, affinity: 3 } }
    - { id: drunk_loud, when: { minDrunk: 60 }, likeAffinity: 200, bad: { annoy: 3, mood: -1 } }
    - { id: leaves_number, when: { minInterest: 55, noNumber: true }, likeAffinity: 25, good: { affinity: 2, number: 1, guilt: 2 }, bad: { annoy: 1 } }
    - { id: stands_up_for_her, when: { minAffinity: 30, pushyNear: true }, likeAffinity: -100, good: { affinity: 4, fear: -6, mood: 2 } }
    - { id: helps_carry, when: {}, likeAffinity: -100, good: { affinity: 2, energy: 2 } }
    - { id: whispers_price, when: { approach: pay }, needOpen: 50, good: { arousal: 2, affinity: 1 }, bad: { shame: 4, annoy: 2 } }
    - { id: watches_bend, when: { minInterest: 45 }, needOpen: 50, likeAffinity: -100, good: { arousal: 2, heat: 10 }, bad: { annoy: 2, heat: 10 } }
    - { id: small_gift, when: { regular: true, minAffinity: 35 }, likeAffinity: -100, good: { mood: 3, affinity: 3 }, secret: { guilt: 2 } }
    - { id: hand_on_waist, when: { approach: push, minInterest: 40 }, likeAffinity: 25, needOpen: 45, good: { arousal: 3 }, bad: { annoy: 4, fear: 2 } }
    - { id: argues_bill, when: { maxGenerosity: 30 }, likeAffinity: 200, bad: { mood: -3, annoy: 2 } }
    - { id: toasts_her, when: { minDrunk: 20 }, likeAffinity: -100, good: { mood: 2, pride: 2 } }
    - { id: asks_closing, when: { minInterest: 50 }, good: { arousal: 2, affinity: 1, longing: 2 }, bad: { annoy: 2 } }
    - { id: sings_along, when: { minDrunk: 35 }, likeAffinity: -100, good: { mood: 2 } }
deal:                 # a guest with money goes to the husband first
  fromTier: 3
  chance: 0.85        # of the paying kind doing so when the husband is in sight
  drunkGenerous: [30, 45]   # other men do it too once drunk and generous enough
  priceFactor: 1.0    # times what he would have put on the table
  hourFactor: 1.6     # "an hour upstairs" costs more than the act
  raise: [1.25, 1.6]  # what the husband can ask instead
  acceptPerGenerosity: 0.012  # chance he takes a raise: generosity and interest
  acceptPerInterest: 0.006
  wantBonus: 10       # his saying "I want you to" in what she answers
  expires: 15         # minutes
  soldTrust: -4       # he took the money and she did not want it
  soldResent: 2
  refusedAffinity: 6
  refuseHerLiked: { resent: 1.5, anger: 4 }
  refuseHerRelief: { tenderness: 4, trust: 2 }
groups:               # a company takes the back room
  fromDay: 3
  chancePerDay: 0.35
  arriveTick: [40, 160]         # minute of the shift
  stay: 150                     # minutes
  size: [3, 5]
  kinds: [stag, office, bikers, team]
  trayEvery: 30                 # minutes between rounds
  trayWait: 20                  # after this long without a round they get restless
  bill: [18, 30]                # per man per round
  tipHer: 0.25                  # share of a round, when she brings it
  tipHusband: 0.05
  heatPerRound: 12
  heatHer: 8                    # extra each time it is her
  restlessReputation: 1
  inside: [10, 20]              # minutes she is in there with a tray
  longInside: [30, 45]          # when it goes further
  tierByHeat: [[0, 1], [25, 2], [45, 4], [65, 6], [85, 7]]
  pressurePerMan: 1
  manyBonus: 0.5                # share of the group that joins once it goes all the way
  tipPerTier: 6                 # per man
  husbandEnergy: 3
  refusedHeat: -10
table:                # sitting down with a guest
  minutes: 15
  perEvening: 3
  slipDrunk: 45       # from here a man who has had her lets something slip
  slipHonesty: 55
  slipSuspicion: 8
  cards: { bet: [20, 50], winChance: 0.45, perDrunk: 0.002, stayTicks: 3 }
  rivalCools: 4       # a husband at his table: his interest in her drops a little
join:                 # the husband joins her and a guest (only once it is in the open)
  consentBonus: 8
  hersRate: 1.3
  power: 3
  done: { delight: 6, shame: 4, arousal: 6 }
  refused: { annoy: 5 }
